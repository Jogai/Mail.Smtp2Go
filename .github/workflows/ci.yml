name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Started by dependabot-lockfiles.yml after it pushes regenerated lock files to a Dependabot branch.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # Packages built here are previews (1.2.3-preview.N); releases come from publish.yml on a v* tag.
  SMTP2GO_VERSION_SUFFIX: preview.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Also the .NET 10 runtime: the test projects run on net10.0 as well as net11.0. global.json still selects SDK 11.0.100.
          dotnet-version: '10.0.x'

      - run: dotnet restore --locked-mode

      - run: dotnet build -c Release --no-restore -warnaserror

      - run: dotnet test -c Release --no-build

      - run: dotnet pack -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
